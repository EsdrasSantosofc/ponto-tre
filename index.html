<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>T.R.E. - Ponto e Obras</title>
  
  <link rel="manifest" href="./manifest.json">
  <meta name="theme-color" content="#0f172a">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="T.R.E. Obras">

  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    .bg-acustico-premium {
      background-image: 
        linear-gradient(to bottom, rgba(15, 23, 42, 0.88), rgba(15, 23, 42, 0.94)),
        url('https://images.unsplash.com/photo-1513694203232-719a280e022f?q=80&w=1920&auto=format&fit=crop');
      background-size: cover;
      background-position: center;
      background-attachment: fixed;
    }

    .card-acustico-blur {
      background: rgba(255, 255, 255, 0.96);
      backdrop-filter: blur(8px);
    }
  </style>
</head>
<body class="bg-acustico-premium text-gray-800 font-sans min-h-screen flex flex-col">

  <div id="pantalla-login" class="flex flex-col items-center justify-center min-h-screen p-4">
    <div class="card-acustico-blur p-8 rounded-2xl shadow-2xl max-w-md w-full text-center border-t-4 border-orange-500">
      <div class="w-16 h-1 bg-orange-500 mx-auto mb-4 rounded-full"></div>
      
      <h1 class="text-3xl font-extrabold text-blue-950 tracking-tight mb-1">T.R.E. Montagens</h1>
      <p class="text-orange-600 font-medium text-sm tracking-wide uppercase mb-8">Avisos e Sistema de Gestão</p>

      <div class="space-y-4">
        <button onclick="mostrarVisao('funcionario')" class="w-full bg-blue-900 hover:bg-blue-950 text-white font-bold py-4 rounded-xl shadow-lg text-lg transition duration-200 border-l-4 border-orange-500 cursor-pointer flex items-center justify-center gap-2">
          <span>👷</span> Acesso Funcionário
        </button>

        <button onclick="solicitarSenhaAdmin()" class="w-full bg-orange-500 hover:bg-orange-600 text-white font-bold py-4 rounded-xl shadow-lg text-lg transition duration-200 cursor-pointer flex items-center justify-center gap-2">
          <span>👑</span> Acesso Administrador (Patrão)
        </button>
      </div>
    </div>
  </div>

  <!-- VISÃO DO FUNCIONÁRIO -->
  <div id="visao-funcionario" class="hidden p-4 max-w-lg mx-auto min-h-screen pb-12 w-full">
    <div class="flex justify-between items-center mb-6 bg-blue-950 p-4 rounded-2xl border-b-2 border-orange-500 shadow-md">
      <h2 class="text-xl font-bold text-white flex items-center gap-2">
        <span>👷</span> Área do Colaborador
      </h2>
      <button onclick="sair()" class="bg-orange-500 hover:bg-orange-600 text-white px-4 py-1.5 rounded-lg text-sm font-semibold transition">Sair</button>
    </div>

    <!-- PONTO -->
    <div class="card-acustico-blur p-6 rounded-2xl shadow-xl space-y-4 border-t-4 border-blue-900">
      <h3 class="text-lg font-bold text-blue-950 border-b pb-2 flex items-center justify-between">
        <span>📍 Registro de Ponto Diário</span>
      </h3>
      <div>
        <label class="block text-sm font-semibold mb-1 text-gray-700">Selecione o seu Nome:</label>
        <select id="ponto-funcionario" class="w-full p-3 border rounded-xl bg-gray-50 focus:ring-2 focus:ring-orange-500 focus:outline-none"></select>
      </div>
      <div>
        <label class="block text-sm font-semibold mb-1 text-gray-700">Selecione a Obra:</label>
        <select id="ponto-obra" class="w-full p-3 border rounded-xl bg-gray-50 focus:ring-2 focus:ring-orange-500 focus:outline-none"></select>
      </div>
      <div>
        <label class="block text-sm font-semibold mb-1 text-gray-700">Data:</label>
        <input type="date" id="ponto-data" class="w-full p-3 border rounded-xl bg-gray-50 focus:ring-2 focus:ring-orange-500 focus:outline-none">
      </div>
      <div>
        <label class="block text-sm font-semibold mb-1 text-gray-700">PIN / Senha:</label>
        <input type="password" id="ponto-pin" placeholder="Digite seu PIN" class="w-full p-3 border rounded-xl bg-gray-50 focus:ring-2 focus:ring-orange-500 focus:outline-none">
      </div>
      <button onclick="registrarPonto()" class="w-full bg-blue-900 hover:bg-blue-950 text-white font-bold py-4 rounded-xl shadow-lg text-lg transition border-b-4 border-orange-500 cursor-pointer">
        📍 BATER PONTO HOJE
      </button>
    </div>
  </div>

  <!-- VISÃO DO ADMIN -->
  <div id="visao-admin" class="hidden min-h-screen flex flex-col w-full">
    <nav class="bg-blue-950 text-white p-4 flex flex-wrap justify-between items-center gap-2 border-b-2 border-orange-500 shadow-md">
      <div class="flex items-center gap-2">
        <div class="w-3 h-3 rounded-full bg-orange-500"></div>
        <h1 class="text-xl font-bold tracking-tight">T.R.E. | Painel do Patrão</h1>
      </div>
      <button onclick="sair()" class="bg-orange-500 hover:bg-orange-600 text-white px-4 py-1.5 rounded-lg text-sm font-semibold transition">Sair</button>
    </nav>

    <div class="p-4 max-w-5xl mx-auto w-full flex-grow">
      <div id="aba-obras" class="aba-content space-y-6">
        <!-- FORMULÁRIO DE CADASTRAR/EDITAR OBRA -->
        <div class="card-acustico-blur p-6 rounded-2xl shadow-xl border-t-4 border-orange-500">
          <h3 class="text-lg font-bold text-blue-950 mb-4" id="titulo-form-obra">Cadastrar Nova Obra</h3>
          <input type="hidden" id="obra-id"> <!-- CAMPO OCULTO PARA SABER SE É EDIÇÃO -->
          
          <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
            <input type="text" id="obra-nome" placeholder="Nome da Obra (ex: Avanço RJ)" class="p-3 border rounded-xl bg-gray-50 focus:ring-2 focus:ring-orange-500 focus:outline-none">
            <input type="text" id="obra-local" placeholder="Localização / Endereço" class="p-3 border rounded-xl bg-gray-50 focus:ring-2 focus:ring-orange-500 focus:outline-none">
          </div>
          <div class="flex gap-2 mt-4">
            <button id="btn-salvar-obra" onclick="salvarObra()" class="bg-orange-500 text-white font-bold px-6 py-2.5 rounded-xl hover:bg-orange-600 transition shadow-md">Salvar Obra</button>
            <button id="btn-cancelar-obra" onclick="limparFormObra()" class="hidden bg-gray-400 text-white font-bold px-4 py-2.5 rounded-xl hover:bg-gray-500 transition">Cancelar</button>
          </div>
        </div>

        <!-- LISTA DE OBRAS -->
        <div class="card-acustico-blur p-6 rounded-2xl shadow-xl border-t-4 border-blue-900">
          <h3 class="text-lg font-bold text-blue-950 mb-4">Obras Cadastradas</h3>
          <ul id="lista-obras" class="divide-y text-gray-700"></ul>
        </div>
      </div>
    </div>
  </div>

  <script>
    const SUPABASE_URL = "https://vjlppbetuqxxfgusqmxf.supabase.co";
    const SUPABASE_ANON_KEY = "sb_publishable_1fJ58_NZXTgATaISERowTQ_vH7ueeex";
    const SENHA_ADMIN_MESTRE = "2026@TRE"; 
    
    let supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    function mostrarVisao(visao) {
      document.getElementById('pantalla-login').classList.add('hidden');
      if (visao === 'admin') {
        document.getElementById('visao-admin').classList.remove('hidden');
        carregarObras();
      } else {
        document.getElementById('visao-funcionario').classList.remove('hidden');
      }
    }

    function solicitarSenhaAdmin() {
      const senha = prompt("Digite a senha do Administrador:");
      if (senha === SENHA_ADMIN_MESTRE) {
        mostrarVisao('admin');
      } else if (senha !== null) {
        alert("Senha incorreta!");
      }
    }

    function sair() {
      document.getElementById('visao-admin').classList.add('hidden');
      document.getElementById('visao-funcionario').classList.add('hidden');
      document.getElementById('pantalla-login').classList.remove('hidden');
    }

    // CARREGAR OBRAS
    async function carregarObras() {
      const { data: obras, error } = await supabaseClient.from('obras').select('*').order('id', { ascending: false });
      if (error) {
        alert("Erro ao carregar obras: " + error.message);
        return;
      }

      const lista = document.getElementById('lista-obras');
      lista.innerHTML = '';

      obras.forEach(obra => {
        const li = document.createElement('li');
        li.className = "py-4 flex flex-wrap justify-between items-center gap-2";
        li.innerHTML = `
          <div>
            <p class="font-bold text-blue-950 text-lg">${obra.nome}</p>
            <p class="text-sm text-gray-500">${obra.local || 'Sem endereço'}</p>
          </div>
          <div class="flex items-center gap-2">
            <button onclick="editarObra(${obra.id}, '${obra.nome.replace(/'/g, "\\'")}', '${(obra.local || '').replace(/'/g, "\\'")}')" class="bg-blue-600 hover:bg-blue-700 text-white px-3 py-1 rounded-lg text-sm font-semibold transition">Editar</button>
            <button onclick="excluirObra(${obra.id})" class="bg-red-600 hover:bg-red-700 text-white px-3 py-1 rounded-lg text-sm font-semibold transition">Excluir</button>
          </div>
        `;
        lista.appendChild(li);
      });
    }

    // SALVAR OBRA (CADASTRAR OU EDITAR)
    async function salvarObra() {
      const id = document.getElementById('obra-id').value;
      const nome = document.getElementById('obra-nome').value.trim();
      const local = document.getElementById('obra-local').value.trim();

      if (!nome) {
        alert("Digite o nome da obra.");
        return;
      }

      if (id) {
        // Se tiver ID, atualiza
        const { error } = await supabaseClient.from('obras').update({ nome, local }).eq('id', id);
        if (error) alert("Erro ao editar: " + error.message);
      } else {
        // Se não tiver ID, cadastra nova
        const { error } = await supabaseClient.from('obras').insert([{ nome, local }]);
        if (error) alert("Erro ao cadastrar: " + error.message);
      }

      limparFormObra();
      carregarObras();
    }

    // CARREGAR DADOS NO FORMULÁRIO PARA EDITAR
    function editarObra(id, nome, local) {
      document.getElementById('obra-id').value = id;
      document.getElementById('obra-nome').value = nome;
      document.getElementById('obra-local').value = local;
      document.getElementById('titulo-form-obra').innerText = "Editar Obra";
      document.getElementById('btn-cancelar-obra').classList.remove('hidden');
    }

    // CANCELAR EDIÇÃO / LIMPAR CAMPOS
    function limparFormObra() {
      document.getElementById('obra-id').value = '';
      document.getElementById('obra-nome').value = '';
      document.getElementById('obra-local').value = '';
      document.getElementById('titulo-form-obra').innerText = "Cadastrar Nova Obra";
      document.getElementById('btn-cancelar-obra').classList.add('hidden');
    }

    // EXCLUIR OBRA
    async function excluirObra(id) {
      if (confirm("Deseja realmente excluir esta obra?")) {
        const { error } = await supabaseClient.from('obras').delete().eq('id', id);
        if (error) {
          alert("Erro ao excluir: " + error.message);
        } else {
          carregarObras();
        }
      }
    }
  </script>
</body>
</html>
